<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f6f1;--surface:#fff;--ink:#16291d;--muted:#66796c;--line:#d5e0d6;--accent:#1f7a4d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101a14;--surface:#18271d;--ink:#e6f0e8;--muted:#92a89a;--line:#2a3d30;--accent:#4fc08a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:28px 16px}
h1{font-size:2.2rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 24px}
a{display:block;background:var(--surface);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:16px;padding:22px 20px;margin-bottom:14px;font-size:1.3rem;font-weight:800}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a small{display:block;font-weight:400;font-size:.95rem;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<main>
<h1>Casa</h1>
<p>¿Qué quieres abrir?</p>
<a href="lista.html">🛒 Lista de la compra<small>Añade artículos y envíalos por WhatsApp</small></a>
<a href="calendario.html">📅 Calendario<small>Eventos por día, semana o en lista</small></a>
</main>
</body>
</html>
