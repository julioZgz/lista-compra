function advance(now){const dt=Math.min((now-S.t)/1000,172800);S.t=now;if(dt<=0)return false;
S.cs.forEach(p=>{if(p.nj)return;const c=cap(p);for(let i=0;i<3;i++){const k='mcg'[i];if(R(p)[k]<c)R(p)[k]=Math.min(c,R(p)[k]+prod(p,i)*dt)}});
if(S.cs.some(p=>p.nj)){const m=mem(),c=m.reduce((a,p)=>a+cap(p),0);for(let i=0;i<3;i++){const k='mcg'[i];if(S.net[k]<c)S.net[k]=Math.min(c,S.net[k]+m.reduce((a,p)=>a+prod(p,i),0)*dt)}}
let ch=false;
S.cs.forEach(p=>{if(p.rr&&p.rr.end<=now){p.dm=p.dm.filter(x=>x!==p.rr.k);toast(`${B[p.rr.k].n} de ${U(p.id).name} reparado`);delete p.rr;ch=true}
if(p.q&&p.q.end<=now){if(p.q.rep)p.dm=p.dm.filter(x=>x!==p.q.k);else p.b[p.q.k]++;toast(`${B[p.q.k].n} de ${U(p.id).name} ${p.q.rep?'reparado':'mejorado'}`);delete p.q;ch=true}
p.rb+=(rbT(p)-p.rb)*Math.min(1,dt/600);if(dt<=120&&p.rb>50&&Math.random()<1-Math.exp(-dt*(p.rb-50)/45000)){attack(p);ch=true}});
S.cs.forEach(p=>{if(p.rq&&p.rq.end<=now){S.tech[p.rq.k]++;toast('Investigación completada: '+T[p.rq.k].n);delete p.rq;ch=true}if(p.sq&&p.sq.end<=now){S.fleet[p.sq.t]++;toast(SH[p.sq.t].n+' construido');delete p.sq;ch=true}});
S.mis=S.mis.filter(m=>{if(m.end>now)return true;ch=true;done(m);return false});if(S.rf&&S.rf.exp<=now){delete S.rf;ch=true}if(S.nv<=now){visitor();S.nv=now+(300+Math.random()*300)*1000/(1+.15*S.cs.reduce((a,p)=>a+lv(p,'p'),0));ch=true}sync();return ch}

function change(){dirty=true;render()}
function build(k){const p=P(SP),L=p.b[k];if(p.q||p.dm.includes(k)||L>=maxL(p,k))return;const c=cost(B[k].b,B[k].f,L);if(!afford(R(p),c))return;for(const x in c)R(p)[x]-=c[x];p.q={k,end:Date.now()+tB(k,L,p)*1000,c};change()}
function research(k){const p=P(SP),L=S.tech[k];if(p.rq||S.cs.some(q=>q.rq&&q.rq.k===k)||L>=T[k].max||lv(p,'l')<L+1)return;const c=cost(T[k].b,T[k].f,L);if(!afford(R(p),c))return;for(const x in c)R(p)[x]-=c[x];p.rq={k,end:Date.now()+tT(k,L,p)*1000,c};change()}
function ship(t){const p=P(SP),d=SH[t];if(p.sq||lv(p,'s')<d.s||!afford(R(p),d.b))return;for(const x in d.b)R(p)[x]-=d.b[x];p.sq={t,end:Date.now()+tS(t,p)*1000,c:d.b};change()}
function repair(k){const p=P(SP);if(p.rr||!p.dm.includes(k))return;const c=repC(p,k);if(!afford(R(p),c))return;for(const x in c)R(p)[x]-=c[x];p.rr={k,end:Date.now()+repT(p,k)*1000,c};change()}
function accel(){const p=P(SP),r=p.rr;if(!r||r.acc)return;const c=repC(p,r.k);if(!afford(R(p),c))return;for(const x in c){R(p)[x]-=c[x];r.c[x]=(r.c[x]||0)+c[x]}r.acc=1;r.end=Date.now()+Math.max(0,r.end-Date.now())/2;change()}
function cancelRR(){const p=P(SP);if(!p.rr)return;for(const x in p.rr.c)R(p)[x]+=p.rr.c[x];delete p.rr;change()}
const rrCard=p=>{const r=p.rr,c=repC(p,r.k);return`<div class=card><div class=row><b>Reparando ${B[r.k].n}</b><span class=lv data-end="${r.end}"></span></div>${r.acc?'':`<div class=chs>${chips(c)}</div>`}<button class=go ${r.acc?'disabled data-off=1':`data-cost='${JSON.stringify(c)}'`} onclick="accel()">${r.acc?'Ya acelerada':'Acelerar: mitad del tiempo restante'}</button><button class=go style="background:#ff8a8a;margin-top:8px" onclick="cancelRR()">Cancelar (recuperas todo)</button></div>`};
function refugee(a){const f=S.rf;if(!f)return;const p=P(f.pid);delete S.rf;
if(a&&p){const pool=R(p);for(const k in f.c)pool[k]=Math.max(0,pool[k]-f.c[k]);p.rb=Math.max(0,p.rb-8);p.rb0=Math.max(0,p.rb0-2);S.ev=`Has acogido a los refugiados en ${U(p.id).name}: baja la rebelión.`}else S.ev='Has rechazado a los refugiados.';toast(S.ev);change()}
const rfCard=()=>{const f=S.rf;if(!f||!P(f.pid))return'';return`<div class=card><div class=row><b>Llegan refugiados a ${U(f.pid).name}</b><span class=lv data-end="${f.exp}"></span></div><p>Aceptarlos cuesta ${f.c.m} de metal, ${f.c.c} de cristal y ${f.c.g} de gas, pero reduce la rebelión del planeta (−8% ahora y −2% para siempre). Si no respondes, se marchan.</p><div class=row><button class=go onclick="refugee(1)">Aceptar</button><button class=go style="background:#ff8a8a" onclick="refugee(0)">Rechazar</button></div></div>`};
function cancelB(){const p=P(SP);if(!p.q)return;for(const x in p.q.c)R(p)[x]+=p.q.c[x];delete p.q;change()}
function cancelR(){const h=P(SP);if(!h.rq)return;for(const x in h.rq.c)R(h)[x]+=h.rq.c[x];delete h.rq;change()}
function cancelS(){const h=P(SP);if(!h.sq)return;for(const x in h.sq.c)R(h)[x]+=h.sq.c[x];delete h.sq;change()}
const qc=(t,e,f)=>`<div class=card><div class=row><b>${t}</b><span class=lv data-end="${e}"></span></div><button class=go style="background:#ff8a8a" onclick="${f}">Cancelar (recuperas todo)</button></div>`;
function strip(){const a=[];S.mis.forEach(m=>a.push([{x:'Explorando',c:'Colonizando',r:'Saqueando'}[m.k]+' '+U(m.to).name,m.end]));
S.cs.forEach(p=>{const n=U(p.id).name;p.q&&a.push([`${B[p.q.k].n} (${n})`,p.q.end]);p.rr&&a.push([`Reparando ${B[p.rr.k].n} (${n})`,p.rr.end]);p.rq&&a.push([`Investigando ${T[p.rq.k].n} (${n})`,p.rq.end]);p.sq&&a.push([`Construyendo ${SH[p.sq.t].n} (${n})`,p.sq.end])});
return a.length?`<div class=ms>${a.map(([t,e])=>`<span class=ch>${t} · <span data-end="${e}"></span></span>`).join('')}</div>`:''}
const need=u=>Math.max(0,Math.ceil((u.dist-2)/2));

if(k==='x'){if(S.fleet.e<1)return;S.fleet.e--}
else{if(S.fleet.c<1||S.cs.length+S.mis.filter(m=>m.k==='c').length>=1+S.tech.c)return;S.fleet.c--}
S.mis.push({k,to,end:Date.now()+Math.ceil(u.dist*20/(1+.25*S.tech.p))*1000});change()}

S.mis.push({k:'r',to,n,end:Date.now()+2*Math.ceil(u.dist*20/(1+.25*S.tech.p))*1000});change()}

for(const x in r)R(S.cs[0])[x]+=r[x];S.cs=S.cs.filter(c=>c.id!==p.id);dirty=true;selPlanet(S.cs[0].id)}

if(V==='b')for(const k in B){const L=p.b[k],mx=maxL(p,k),i=IDX[k];if(p.dm.includes(k)){h+=card(B[k].n,`Nivel ${L}/${mx}`,'⚠ Dañado: no funciona hasta que lo repares.',repC(p,k),'Reparar',`repair('${k}')`,p.rr?'Reparación en curso':'',icon(BI[k],k in IDX?k:''),repT(p,k));continue}
let d=B[k].d+(i!==undefined?` Ahora: ${prod(p,i).toFixed(1)}/s. Este planeta limita la mina al nivel ${mx}. Más nivel, más rebelión.`:'');

else if(V==='i')for(const k in T){const L=S.tech[k],lab=lv(p,'l');
h+=card(T[k].n,`Nivel ${L}/${T[k].max}`,T[k].d+' Investigación compartida por todos tus planetas.',L<T[k].max?cost(T[k].b,T[k].f,L):null,'Investigar',`research('${k}')`,L>=T[k].max?'Nivel máximo':p.rq?'Investigación en curso':S.cs.some(q=>q.rq&&q.rq.k===k)?'Ya se investiga en otro planeta':lab<L+1?`Requiere laboratorio nivel ${L+1}`:'',icon(TI[k]),L<T[k].max?tT(k,L,p):0)}
else if(V==='f'){for(const t in SH){const d=SH[t];h+=card(d.n,`Disponibles: ${S.fleet[t]}`,d.d,d.b,'Construir',`ship('${t}')`,lv(p,'s')<d.s?`Requiere astillero nivel ${d.s}`:p.sq?'Astillero ocupado':'',icon(SI[t]),tS(t,p))}
h+='<b>Misiones en curso</b>'+(S.mis.length?S.mis.map(m=>`<div class=card><div class=row><b>${{x:'Explorando',c:'Colonizando',r:'Saqueando'}[m.k]} ${U(m.to).name}${m.k==='r'?' ('+m.n+')':''}</b><span class=lv data-end=${m.end}></span></div></div>`).join(''):'<p class=st>No hay misiones en curso.</p>')}
else if(V==='x'){const ch=(f,cur)=>RS.map(k=>`<button class="tab ${k===cur?'on':''}" onclick="${f}('${k}')"><span class="${k}">${RN[k]}</span></button>`).join('');
h=`<div class=card><b>Comercio en ${U(p.id).name}</b><p>Los mercaderes cambian recursos con una comisión del 20%. Los valores relativos son: 1 metal, 1,7 cristal y 3,4 gas.</p><div class=st>Dar</div><div class=tabs>${ch('tf',TF)}</div><div class=st>Recibir</div><div class=tabs>${ch('tt',TT)}</div><div class=st>Cantidad (tienes ${fmt(R(p)[TF])})</div><input id=ta type=number inputmode=numeric min=0 value="${TA}" oninput="tin(this.value)"><button class="tab" type=button onclick="tmax()">Todo</button><p id=tp style="margin-top:10px"></p><button class=go onclick="trade()">Cambiar</button></div>`}
else{const tt2={m:0,c:0,g:0},pp=[0,0,0];S.cs.forEach(q=>{for(let i=0;i<3;i++){if(!q.nj)tt2['mcg'[i]]+=R(q)['mcg'[i]];pp[i]+=prod(q,i)}});if(S.cs.some(q=>q.nj))for(const k in tt2)tt2[k]+=S.net[k];

S.u.filter(u=>u.id).forEach(u=>{const own=P(u.id),kn=S.known.includes(u.id),bm=S.mis.find(m=>m.to===u.id),busy=!!bm,n=need(u),secs=Math.ceil(u.dist*20/(1+.25*S.tech.p));
