<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colonias Estelares</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1523;--pn:#16213a;--ln:#2a3b5e;--tx:#e8eefb;--mu:#93a4c4;--m:#e8a86a;--c:#76d6f2;--g:#b9a2ff;--ok:#5be3b0}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:15px/1.4 system-ui,sans-serif;background:var(--bg);
background-image:radial-gradient(1px 1px at 20px 30px,#fff8,transparent),radial-gradient(1px 1px at 120px 90px,#fff6,transparent),radial-gradient(1.5px 1.5px at 200px 160px,#fff9,transparent);background-size:240px 200px;background-attachment:fixed;
padding:0 0 calc(76px + env(safe-area-inset-bottom))}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:4px 0 2px}
.top{padding-top:env(safe-area-inset-top,0px)}
#app{max-width:640px;margin:0 auto;padding:12px}
h1,b,.lv,.rs strong{font-family:'Chakra Petch',system-ui,sans-serif}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.st{color:var(--mu);font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;display:flex;align-items:center;gap:6px;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font:inherit}
.tab.on{border-color:var(--ok)}
.orb{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}
.rs{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px}
.rs span{font-size:12px}.rs strong{display:block;font-size:15px}.rs small{color:var(--mu);font-size:12px}
.full{color:#ff8a8a}
.m{color:var(--m)}.c{color:var(--c)}.g{color:var(--g)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.card p{margin:4px 0 8px;color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lv{font-size:13px;color:var(--mu)}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ch{font-style:normal;font-size:12px;border:1px solid var(--ln);border-radius:6px;padding:2px 6px}
button{font:inherit;cursor:pointer}
.card button,.go{width:100%;background:var(--ok);color:#06231a;border:0;border-radius:8px;padding:10px;font-weight:600}
button:disabled{background:#26344f!important;color:var(--mu)!important;cursor:default}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0a111d;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:14px 4px}
nav button.on{color:var(--ok);font-weight:700}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit;margin:10px 0}
#toast{position:fixed;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;max-width:616px;margin:auto;background:var(--ok);color:#06231a;border-radius:10px;padding:10px 12px;font-weight:600;z-index:9;display:none}
.pl{display:flex;gap:10px;align-items:center}.pl .orb{width:34px;height:34px}
.tag{font-size:12px;color:var(--ok)}
.ic{width:46px;height:46px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);display:grid;place-items:center;flex:none;color:var(--ok)}
.ic.m{color:var(--m)}.ic.c{color:var(--c)}.ic.g{color:var(--g)}
</style></head><body>
<div id="toast"></div><div id="app"></div>
<script>
const DB='https://lista-compra-3e6a2-default-rtdb.europe-west1.firebasedatabase.app';
const RN={m:'Metal',c:'Cristal',g:'Gas'},IDX={m:0,c:1,g:2},K=[.5,.3,.15];
const B={m:{n:'Mina de metal',d:'Produce metal.',b:{m:60,c:15},f:1.6},c:{n:'Mina de cristal',d:'Produce cristal.',b:{m:48,c:24},f:1.6},g:{n:'Extractor de gas',d:'Produce gas.',b:{m:75,c:30},f:1.6},
a:{n:'Almacén',d:'Aumenta la capacidad de recursos.',b:{m:100,c:50},f:1.8,max:12},
s:{n:'Astillero',d:'Nivel 1 construye exploradores; nivel 2, colonizadores.',b:{m:200,c:100},f:1.7,max:8},
l:{n:'Laboratorio',d:'Necesario para investigar. Su nivel limita las tecnologías.',b:{m:150,c:200},f:1.7,max:8}};
const T={p:{n:'Propulsión',d:'Más alcance (+2 de distancia) y viajes más rápidos.',b:{c:100,g:60},f:1.9,max:8},
c:{n:'Colonización',d:'Permite un planeta colonizado más por nivel.',b:{c:200,g:120},f:2,max:6},
e:{n:'Eficiencia',d:'+10% de producción en todas las minas.',b:{m:200,c:200,g:100},f:1.9,max:10}};
const SH={e:{n:'Explorador',d:'Revela los recursos de un planeta.',b:{m:150,c:100,g:40},s:1},
c:{n:'Colonizador',d:'Funda una colonia en un planeta explorado.',b:{m:600,c:400,g:250},s:2},
r:{n:'Corsario',d:'Nave de combate: saquea planetas explorados y trae botín a tu primera colonia.',b:{m:300,c:200,g:100},s:2}};
const $=s=>document.querySelector(s);
let S=null,SP=0,V='b',code=localStorage.getItem('je_code')||'',dirty=false,st='',err='';
const cost=(b,f,L)=>Object.fromEntries(Object.entries(b).map(([k,v])=>[k,Math.round(v*Math.pow(f,L))]));
const afford=(r,c)=>Object.keys(c).every(k=>r[k]>=c[k]);
const fmt=n=>n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n);
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const P=id=>S.cs.find(c=>c.id===id),U=id=>S.u.find(p=>p.id===id);
const cap=p=>Math.round(1000*Math.pow(1.7,p.b.a));
const prod=(p,i)=>{const L=p.b['mcg'[i]];return K[i]*L*Math.pow(1.15,L)*(1+.1*S.tech.e)};
const maxL=(p,k)=>k in IDX?U(p.id).rich[IDX[k]]:B[k].max;
const icon=(p,c)=>`<div class="ic ${c||''}"><svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg></div>`;
const BI={m:`<path d="M6 40L18 18l8 12 6-8 10 18z"/><path d="M14 8l20 8M24 6l-6 12"/>`,
c:`<path d="M24 6l10 10-10 26L14 16z"/><path d="M14 16h20M24 6v36"/>`,
g:`<path d="M14 36a8 8 0 010-16 10 10 0 0119-2 8 8 0 011 18z"/><path d="M18 42h4M26 42h6"/>`,
a:`<path d="M6 20L24 8l18 12v22H6z"/><path d="M16 42V28h16v14M16 35h16"/>`,
s:`<path d="M24 6c6 6 8 14 6 24H18c-2-10 0-18 6-24z"/><circle cx="24" cy="18" r="3"/><path d="M18 30l-6 8M30 30l6 8M6 42h36"/>`,
l:`<path d="M19 6h10M21 6v12L10 38a3 3 0 003 5h22a3 3 0 003-5L27 18V6"/><path d="M15 32h18"/>`};
const TI={p:`<path d="M24 6c8 8 8 18 0 26-8-8-8-18 0-26z"/><path d="M24 32v10M18 36l-2 6M30 36l2 6"/>`,
c:`<path d="M8 38a16 16 0 0132 0z"/><path d="M4 38h40M24 22v-8M24 14h8l-3 3 3 3h-8"/>`,
e:`<path d="M27 4L10 27h12l-3 17 19-24H26z"/>`};
const SI={e:`<path d="M24 4l6 14v16l-6 6-6-6V18z"/><circle cx="24" cy="20" r="2.5"/><path d="M18 30l-8 6M30 30l8 6"/>`,
c:`<rect x="14" y="10" width="20" height="26" rx="5"/><path d="M14 28l-8 10M34 28l8 10M20 36v6M28 36v6M18 18h12M18 24h12"/>`,
r:`<path d="M24 6l16 34-16-8-16 8z"/><path d="M24 14v18"/>`};
let gid=0;
function planet(id,sz,unk){
if(unk)return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" style="flex:none"><circle cx="32" cy="32" r="22" fill="#111c31" stroke="#2a3b5e" stroke-width="2" stroke-dasharray="4 4"/><text x="32" y="41" text-anchor="middle" font-size="24" fill="#93a4c4" font-family="Chakra Petch,sans-serif">?</text></svg>`;
const r=rng(id*7919+3),h=(id*47+20)%360,g='pg'+(++gid);let d='';
for(let i=0;i<4;i++){const y=10+r()*44,hh=4+r()*9;d+=`<rect x="0" y="${y.toFixed(1)}" width="64" height="${hh.toFixed(1)}" fill="hsl(${(h+r()*50-25)|0} 55% ${r()<.5?25:62}%)" opacity=".35"/>`}
for(let i=0;i<2+id%3;i++)d+=`<circle cx="${(16+r()*32)|0}" cy="${(16+r()*32)|0}" r="${(2+r()*4)|0}" fill="#000" opacity=".18"/>`;
const ring=id%3===0?`<ellipse cx="32" cy="34" rx="30" ry="8" fill="none" stroke="hsl(${h} 40% 75%)" stroke-width="2.5" opacity=".7" transform="rotate(-18 32 32)"/>`:'';
return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" style="flex:none"><defs><radialGradient id="${g}" cx=".32" cy=".3" r=".85"><stop offset="0" stop-color="hsl(${h} 70% 72%)"/><stop offset=".6" stop-color="hsl(${h} 60% 36%)"/><stop offset="1" stop-color="hsl(${h} 50% 12%)"/></radialGradient><clipPath id="${g}c"><circle cx="32" cy="32" r="22"/></clipPath></defs><circle cx="32" cy="32" r="22" fill="url(#${g})"/><g clip-path="url(#${g}c)">${d}</g>${ring}</svg>`}
const orb=id=>planet(id,20);
const chips=c=>Object.entries(c).map(([k,v])=>`<i class="ch ${k}">${fmt(v)} ${RN[k]}</i>`).join('');
const card=(t,lv,d,c,lab,fn,off,ic)=>`<div class=card><div class=row><div class=pl>${ic||''}<b>${t}</b></div><span class=lv>${lv}</span></div><p>${d}</p>${c?`<div class=chs>${chips(c)}</div>`:''}<button ${c?`data-cost='${JSON.stringify(c)}'`:''} ${off?'disabled data-off=1':''} onclick="${fn}">${off||lab}</button></div>`;

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4000)}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newGame(){const r=rng(Date.now()),sy=['Kor','Vex','Ael','Zan','Tir','Oru','Nex','Lum','Yra','Dax','Pel','Mor'];
const u=[{id:0,name:'Hogar',dist:0,rich:[8,6,4]}];
for(let i=1;i<=14;i++){const dist=i+(i>2&&r()<.4?1:0);
u.push({id:i,name:sy[Math.floor(r()*12)]+sy[Math.floor(r()*12)].toLowerCase()+'-'+(1+Math.floor(r()*9)),dist,
rich:[0,1,2].map(()=>Math.max(2,Math.min(12,Math.round(2+r()*6+dist*.35))))})}
return{t:Date.now(),u,tech:{p:0,c:0,e:0},fleet:{e:1,c:0},known:[0],mis:[],
cs:[{id:0,b:{m:1,c:1,g:0,a:0,s:0,l:0},r:{m:400,c:200,g:0}}]}}

function done(m){const u=U(m.to);
if(m.k==='x'){if(!S.known.includes(m.to))S.known.push(m.to);S.fleet.e++;toast('Exploración de '+u.name+' completada')}
else if(m.k==='r'){const def=Math.ceil(u.dist/2)+1,ch=Math.max(.15,Math.min(.95,.5+.15*(m.n-def))),key='p'+m.to,cnt=S.rd[key]||0;
if(Math.random()<ch){const f=Math.pow(.85,cnt),l={};[0,1,2].forEach(i=>{l['mcg'[i]]=Math.round(m.n*(40+25*u.dist)*u.rich[i]/6*f*(i===2?.5:1))});S.rd[key]=cnt+1;const t=S.cs[0];for(const k in l)t.r[k]+=l[k];S.fleet.r+=m.n;
S.ev=`Saqueo en ${u.name}: botín de ${l.m} de metal, ${l.c} de cristal y ${l.g} de gas.`;toast(S.ev)}
else{const lost=Math.ceil(m.n/2);S.fleet.r+=m.n-lost;S.ev=`Saqueo fallido en ${u.name}: pierdes ${lost} corsario(s).`;toast(S.ev)}}
else if(S.cs.length<1+S.tech.c){S.cs.push({id:m.to,b:{m:0,c:0,g:0,a:0,s:0,l:0},r:{m:150,c:80,g:0}});toast('Nueva colonia: '+u.name)}
else{S.fleet.c++;toast('No hay capacidad para colonizar '+u.name)}}
function visitor(){let pw=0;S.cs.forEach(p=>{for(const k in p.b)pw+=p.b[k]});for(const k in S.tech)pw+=2*S.tech[k];
const f=.6+Math.random()*.8,g={m:Math.round((40+pw*14)*f),c:Math.round((30+pw*10)*f),g:Math.round((12+pw*4)*f)};
const p=S.cs[Math.floor(Math.random()*S.cs.length)],who=['Unos mercaderes','Unos peregrinos','Una nave a la deriva'][Math.floor(Math.random()*3)];
for(const k in g)p.r[k]+=g[k];
S.ev=`${who} han visitado ${U(p.id).name} y dejan ${g.m} de metal, ${g.c} de cristal y ${g.g} de gas.`;toast(S.ev)}
function advance(now){const dt=Math.min((now-S.t)/1000,172800);S.t=now;if(dt<=0)return false;
S.cs.forEach(p=>{const c=cap(p);for(let i=0;i<3;i++){const k='mcg'[i];if(p.r[k]<c)p.r[k]=Math.min(c,p.r[k]+prod(p,i)*dt)}});
let ch=false;S.mis=S.mis.filter(m=>{if(m.end>now)return true;ch=true;done(m);return false});if(S.nv<=now){visitor();S.nv=now+(300+Math.random()*300)*1000;ch=true}return ch}

function change(){dirty=true;render()}
function build(k){const p=P(SP),L=p.b[k];if(L>=maxL(p,k))return;const c=cost(B[k].b,B[k].f,L);if(!afford(p.r,c))return;for(const x in c)p.r[x]-=c[x];p.b[k]++;change()}
function research(k){const p=P(SP),L=S.tech[k];if(L>=T[k].max||p.b.l<L+1)return;const c=cost(T[k].b,T[k].f,L);if(!afford(p.r,c))return;for(const x in c)p.r[x]-=c[x];S.tech[k]++;change()}
function ship(t){const p=P(SP),d=SH[t];if(p.b.s<d.s||!afford(p.r,d.b))return;for(const x in d.b)p.r[x]-=d.b[x];S.fleet[t]++;change()}
const need=u=>Math.max(0,Math.ceil((u.dist-2)/2));
function send(k,to){const u=U(to);if(S.tech.p<need(u))return;
if(k==='x'){if(S.fleet.e<1)return;S.fleet.e--}
else{if(S.fleet.c<1||S.cs.length+S.mis.filter(m=>m.k==='c').length>=1+S.tech.c)return;S.fleet.c--}
S.mis.push({k,to,end:Date.now()+Math.ceil(u.dist*20/(1+.25*S.tech.p))*1000});change()}

function raid(to){const u=U(to);if(S.tech.p<need(u)||S.fleet.r<1||P(to)||S.mis.some(m=>m.to===to))return;const n=S.fleet.r;S.fleet.r=0;
S.mis.push({k:'r',to,n,end:Date.now()+2*Math.ceil(u.dist*20/(1+.25*S.tech.p))*1000});change()}
/* Guardado en Firebase */
const key=()=>encodeURIComponent(code.replace(/[.$#\[\]\/]/g,'_'));
async function save(){if(!S||!code)return;advance(Date.now());
try{const r=await fetch(`${DB}/juego_espacial/${key()}.json`,{method:'PUT',body:JSON.stringify(S),keepalive:true});if(!r.ok)throw 0;dirty=false;st='Guardado'}
catch(e){st='Sin guardar (revisa la conexión o las reglas de Firebase)'}setSt()}
function setSt(){const e=$('#st');if(e)e.textContent=st}
async function load(c){code=c.trim();if(!code)return;localStorage.setItem('je_code',code);err='';st='Cargando…';S=null;render();
try{const r=await fetch(`${DB}/juego_espacial/${key()}.json`);if(!r.ok)throw 0;const d=await r.json();
S=d||newGame();S.mis=S.mis||[];S.known=S.known||[0];S.fleet.r=S.fleet.r||0;S.rd=S.rd||{};S.nv=S.nv||Date.now()+(300+Math.random()*300)*1000;SP=S.cs[0].id;advance(Date.now());dirty=!d;st=d?'Partida cargada':'Partida nueva';if(!d)save()}
catch(e){S=null;err='No se pudo conectar con Firebase. Comprueba las reglas de la base de datos.'}render()}
function logout(){code='';S=null;localStorage.removeItem('je_code');render()}

/* Vistas */
function view(p){let h='';
if(V==='b')for(const k in B){const L=p.b[k],mx=maxL(p,k),i=IDX[k];
let d=B[k].d+(i!==undefined?` Ahora: ${prod(p,i).toFixed(1)}/s. Este planeta limita la mina al nivel ${mx}.`:'');
h+=card(B[k].n,`Nivel ${L}/${mx}`,d,L<mx?cost(B[k].b,B[k].f,L):null,'Mejorar',`build('${k}')`,L>=mx?'Nivel máximo':'',icon(BI[k],k in IDX?k:''))}
else if(V==='i')for(const k in T){const L=S.tech[k],lab=p.b.l;
h+=card(T[k].n,`Nivel ${L}/${T[k].max}`,T[k].d+' Investigación compartida por todos tus planetas.',L<T[k].max?cost(T[k].b,T[k].f,L):null,'Investigar',`research('${k}')`,L>=T[k].max?'Nivel máximo':lab<L+1?`Requiere laboratorio nivel ${L+1} en este planeta`:'',icon(TI[k]))}
else if(V==='f'){for(const t in SH){const d=SH[t];h+=card(d.n,`Disponibles: ${S.fleet[t]}`,d.d,d.b,'Construir',`ship('${t}')`,p.b.s<d.s?`Requiere astillero nivel ${d.s} en este planeta`:'',icon(SI[t]))}
h+='<b>Misiones en curso</b>'+(S.mis.length?S.mis.map(m=>`<div class=card><div class=row><b>${{x:'Explorando',c:'Colonizando',r:'Saqueando'}[m.k]} ${U(m.to).name}${m.k==='r'?' ('+m.n+')':''}</b><span class=lv data-end=${m.end}></span></div></div>`).join(''):'<p class=st>No hay misiones en curso.</p>')}
else{h+=`<p class=st>Alcance actual: distancia ${2+2*S.tech.p}. Colonias: ${S.cs.length}/${1+S.tech.c}.</p>`;
S.u.filter(u=>u.id).forEach(u=>{const own=P(u.id),kn=S.known.includes(u.id),busy=S.mis.some(m=>m.to===u.id),n=need(u),secs=Math.ceil(u.dist*20/(1+.25*S.tech.p));
let info=kn?`Máx. de minas: metal ${u.rich[0]}, cristal ${u.rich[1]}, gas ${u.rich[2]}`:'Recursos desconocidos',btn;
if(own)btn=`<button class=go onclick="SP=${u.id};V='b';render()">Ir a la colonia</button>`;
else{const k=kn?'c':'x',lab=kn?'Colonizar':'Explorar',have=kn?S.fleet.c:S.fleet.e,slot=!kn||S.cs.length+S.mis.filter(m=>m.k==='c').length<1+S.tech.c;
const off=busy?'En camino':S.tech.p<n?`Fuera de alcance: Propulsión ${n}`:have<1?`Necesitas un ${kn?'colonizador':'explorador'}`:!slot?'Sin capacidad: investiga Colonización':'';
btn=`<button class=go ${off?'disabled':''} onclick="send('${k}',${u.id})">${off||lab+' ('+fmtT(secs)+')'}</button>`}
let rb='';if(!own&&kn){const n2=S.fleet.r,def=Math.ceil(u.dist/2)+1,pc=Math.round(100*Math.max(.15,Math.min(.95,.5+.15*(n2-def)))),cnt=S.rd['p'+u.id]||0;
const off=busy?'En camino':S.tech.p<n?`Fuera de alcance: Propulsión ${n}`:n2<1?'Necesitas corsarios':'';
rb=`<div class=st style="margin:8px 0 4px">Defensa ${def}${cnt?' · botín reducido por saqueos previos':''}</div><button class=go style="background:#e8a86a" ${off?'disabled':''} onclick="raid(${u.id})">${off||`Saquear con ${n2} corsarios (~${pc}%, ${fmtT(2*secs)})`}</button>`}
h+=`<div class=card><div class=pl>${planet(u.id,60,!kn&&!own)}<div><b>${kn||own?u.name:'Planeta sin explorar'}</b><div class=st>Distancia ${u.dist} · ${info}</div></div></div>${own?'<div class=tag>Colonizado</div>':''}<div style="margin-top:8px">${btn}</div>${rb}</div>`})}
return h}
function render(){const a=$('#app');
if(!S){a.innerHTML=`<div style="text-align:center">${planet(0,130)}</div><h1>Colonias Estelares</h1><p class=st>Escribe el nombre de tu partida. Si no existe, se crea una nueva.</p><input id=cd placeholder="Nombre de la partida" value="${code}" autocapitalize=off><button class=go onclick="load($('#cd').value)">Entrar</button><p class=st>${err||st}</p>`;return}
const p=P(SP);
a.innerHTML=`<div class=top><h1>Colonias Estelares</h1><div class=st><span id=st>${st}</span> <button onclick="logout()" style="background:none;border:0;color:var(--mu);text-decoration:underline">Salir</button></div></div>
